# Robot camera server configuration: one entry per published view. Read by
# gear_sonic.camera.run_from_config, which the systemd service composed_camera_server on the
# robot runs (installed by tng/scripts/setup_camera_server.sh).
# After editing:  sudo systemctl restart composed_camera_server        (on the robot)
# Check:          gear_sonic/scripts/run_camera_viewer.py: one tile per view, upright
#
# Per view:
#   driver:     realsense | usb | oak | oak_mono | zed
#   device:     realsense / oak: serial / MxID, quoted (keeps leading zeros);
#               usb: "/dev/v4l/by-id/...", "/dev/v4l/by-path/...", "match:<substring>" or an
#               index. tng/scripts/list_cameras.sh lists the connected cameras with ready entries.
#   rotate180:  true if the camera is mounted upside down (optional)
#   resolution: [width, height] the view is published and recorded at (realsense, usb, oak;
#               optional, default 424x240, OAK 640x480). A RealSense accepts only its native
#               modes, a USB camera is center-cropped to the aspect ratio and scaled, an OAK
#               scales to any size; tng/scripts/list_cameras.sh lists each camera's native modes.
#               (`hd: true` is short for [1280, 720].)
# View names: ego_view, left_wrist, right_wrist. The data exporter records these and the policy
# client sends them; other names are published, but need --extra-cameras to be recorded or used.
# Keep this file unchanged once data is recorded: models only work with the camera setup they
# were trained on.

port: 5555
fps: 30

views:
  ego_view: # head camera
    driver: oak
    device: "14442C1041B5B2CE00"
    resolution: [640, 480]
  left_wrist: # RealSense D405
    driver: realsense
    device: "260322270540"
    resolution: [640, 480]
  right_wrist: # RealSense D405
    driver: realsense
    device: "260622272778"
    resolution: [640, 480]
    rotate180:  true

